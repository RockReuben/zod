# Diagram Map
# Maps file globs to diagram files and node IDs within those diagrams.
# The most specific glob wins when multiple patterns match.

- glob: "apps/server/**"
  diagram: "docs/diagrams/system-overview.md"
  node: "server"

- glob: "apps/client/**"
  diagram: "docs/diagrams/system-overview.md"
  node: "client"

- glob: ".claude/hooks/**"
  diagram: "docs/diagrams/system-overview.md"
  node: "hooks"

- glob: "docs/diagrams/**"
  diagram: "docs/diagrams/system-overview.md"
  node: "database"

- glob: "docs/plans/**"
  diagram: "docs/diagrams/system-overview.md"
  node: "planning"

- glob: "apps/server/code_graph.py"
  diagram: "docs/diagrams/system-overview.md"
  node: "codebase"

- glob: "apps/client/src/views/CodebaseView.tsx"
  diagram: "docs/diagrams/system-overview.md"
  node: "codebase"

- glob: "apps/client/src/components/CodebaseCanvas.tsx"
  diagram: "docs/diagrams/system-overview.md"
  node: "codebase"

- glob: "apps/client/src/stores/codeGraph.ts"
  diagram: "docs/diagrams/system-overview.md"
  node: "codebase"

- glob: "apps/client/src/hooks/useCodeGraph.ts"
  diagram: "docs/diagrams/system-overview.md"
  node: "codebase"